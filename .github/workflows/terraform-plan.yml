name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/**"
      - ".github/actions/**"

  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev

    env:
      TF_VAR_hosted_zone_id: ${{ vars.TF_VAR_HOSTED_ZONE_ID }}
      TF_VAR_site_bucket_name: ${{ vars.TF_VAR_SITE_BUCKET_NAME }}

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Terraform Environment
        uses: ./.github/actions/terraform-setup
        with:
          working-directory: terraform/environments/dev
          terraform-version: "1.15.3"
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Terraform Plan
        run: |
          echo "### Terraform Plan Summary" > plan.txt
          terraform plan -no-color | tee -a plan.txt

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: terraform/environments/dev/plan.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}